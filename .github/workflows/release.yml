name: Release

# Signed APK for this fork only. I do not own Play, F-Droid, or derdilla's key.
# Obtainium tracks the GitHub Release this job publishes.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(bash ./scripts/ci/flutter_version.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Disable analytics
        run: flutter config --no-analytics --suppress-analytics

      - name: Tag must match app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          eval "$(bash ./scripts/ci/app_version.sh)"
          echo "tag=$tag version=$name"
          test "$tag" = "$name"

      - name: Generate code
        run: bash ./scripts/ci/codegen.sh

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Test schedules and PDF dates across daylight saving time
        env:
          TZ: Europe/Berlin
        run: flutter test test/core/medication_persistence_test.dart test/model/export_import/pdf_export_content_test.dart

      - name: Golden tests
        run: flutter test --tags gold --run-skipped

  build-apk:
    name: Signed APKs
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(bash ./scripts/ci/flutter_version.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Disable analytics
        run: flutter config --no-analytics --suppress-analytics

      - name: Signing property serialization
        run: python3 scripts/ci/test_signing_properties.py

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ./scripts/ci/decode_keystore.sh

      - name: Generate code
        run: bash ./scripts/ci/codegen.sh

      - name: Build release APK
        run: bash ./scripts/ci/build_release_apk.sh

      - name: Verify APK is not debug-signed
        run: |
          eval "$(bash ./scripts/ci/app_version.sh)"
          for suffix in armeabi-v7a arm64-v8a x86_64 universal; do
            apk="dist/janan-${name}-${suffix}.apk"
            test -s "$apk" || { echo "Missing APK: $apk" >&2; exit 1; }
          done
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          apksigner=$(ls "$sdk"/build-tools/*/apksigner | sort -V | tail -1)
          if [[ ! -x "$apksigner" ]]; then
            echo "apksigner not found under $sdk/build-tools" >&2
            exit 1
          fi
          for apk in dist/janan-*.apk; do
            echo "Checking $apk"
            certs=$("$apksigner" verify --print-certs "$apk")
            echo "$certs"
            if echo "$certs" | grep -q "CN=Android Debug"; then
              echo "Release APK is still debug-signed: $apk" >&2
              exit 1
            fi
          done
          unzip -l "dist/janan-${name}-symbols.zip" | grep -q 'mapping.txt'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            janan-*.apk
            janan-*-symbols.zip
