name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(bash ./scripts/ci/flutter_version.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Disable analytics
        run: flutter config --no-analytics --suppress-analytics

      - name: Generate code
        run: bash ./scripts/ci/codegen.sh

      - name: Check translation JSON files parse
        run: |
          python3 - <<'PY'
          import glob, json, sys
          paths = glob.glob("assets/translations/*.json")
          if not paths:
              sys.exit("no translation JSON files")
          for path in paths:
              with open(path, encoding="utf-8") as handle:
                  data = json.load(handle)
              if not isinstance(data, dict) or not data:
                  sys.exit(f"{path} is not a non-empty object")
          print(f"checked {len(paths)} files")
          PY

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Test medication schedules across daylight saving time
        env:
          TZ: Europe/Berlin
        run: flutter test test/core/medication_persistence_test.dart

      - name: Golden tests
        run: flutter test --tags gold --run-skipped

  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(bash ./scripts/ci/flutter_version.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Disable analytics
        run: flutter config --no-analytics --suppress-analytics

      - name: Generate code
        run: bash ./scripts/ci/codegen.sh

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Native widget unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Signing property serialization
        run: python3 scripts/ci/test_signing_properties.py

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: janan-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  release-apk:
    name: Release APK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(bash ./scripts/ci/flutter_version.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Disable analytics
        run: flutter config --no-analytics --suppress-analytics

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ./scripts/ci/decode_keystore.sh

      - name: Generate code
        run: bash ./scripts/ci/codegen.sh

      - name: Build release APK
        run: bash ./scripts/ci/build_release_apk.sh

      - name: Verify APK is not debug-signed
        run: |
          eval "$(bash ./scripts/ci/app_version.sh)"
          for suffix in armeabi-v7a arm64-v8a x86_64 universal; do
            apk="dist/janan-${name}-${suffix}.apk"
            test -s "$apk" || { echo "Missing APK: $apk" >&2; exit 1; }
          done
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          apksigner=$(ls "$sdk"/build-tools/*/apksigner | sort -V | tail -1)
          if [[ ! -x "$apksigner" ]]; then
            echo "apksigner not found under $sdk/build-tools" >&2
            exit 1
          fi
          for apk in dist/janan-*.apk; do
            echo "Checking $apk"
            certs=$("$apksigner" verify --print-certs "$apk")
            echo "$certs"
            if echo "$certs" | grep -q "CN=Android Debug"; then
              echo "Release APK is still debug-signed: $apk" >&2
              exit 1
            fi
          done
          unzip -l "dist/janan-${name}-symbols.zip" | grep -q 'mapping.txt'

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: janan-release-apk
          path: dist/*
          if-no-files-found: error
