name: 'PR checks'
permissions:
  contents: read
on:
  pull_request:
    types:
      - synchronize
      - labeled
      - opened
      - reopened
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "ios/**"
      - "assets/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "dart_test.yaml"
      - ".github/workflows/pr.yml"

jobs:
  validate-localizations:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: "assets/translations"
      - name: Check translation JSON files parse
        run: |
          python3 - <<'PY'
          import glob, json, sys
          paths = glob.glob("assets/translations/*.json")
          if not paths:
              sys.exit("no translation JSON files")
          for path in paths:
              with open(path, encoding="utf-8") as handle:
                  data = json.load(handle)
              if not isinstance(data, dict) or not data:
                  sys.exit(f"{path} is not a non-empty object")
          print(f"checked {len(paths)} files")
          PY
  check-lints:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            pubspec.yaml
            pubspec.lock
            analysis_options.yaml
            dart_test.yaml
            lib
            test
            android
            ios
            assets
            integration_test
      - name: Extract Flutter version
        id: get_version
        run: |
          VERSION=$(sed -n -E "s/^[[:space:]]*flutter:[[:space:]]*([0-9]+\.[0-9.]+).*/\1/p" pubspec.yaml)
          if [ -z "$VERSION" ]; then
            echo "Error: Could not find a Flutter version specified in pubspec.yaml."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.get_version.outputs.version }}
          cache: true
      - name: Disable analytics
        run: flutter config --no-analytics --suppress-analytics
      - run: flutter pub get --enforce-lockfile
      - name: Generate Riverpod and mocks
        run: dart run build_runner build
      - name: Analyze code
        run: flutter analyze --no-fatal-infos
  check-goldens:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            pubspec.yaml
            pubspec.lock
            analysis_options.yaml
            dart_test.yaml
            lib
            test
            android
            ios
            assets
            integration_test
      - name: Extract Flutter version
        id: get_version
        run: |
          VERSION=$(sed -n -E "s/^[[:space:]]*flutter:[[:space:]]*([0-9]+\.[0-9.]+).*/\1/p" pubspec.yaml)
          if [ -z "$VERSION" ]; then
            echo "Error: Could not find a Flutter version specified in pubspec.yaml."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.get_version.outputs.version }}
          cache: true
      - name: Disable analytics
        run: flutter config --no-analytics --suppress-analytics
      - run: flutter pub get --enforce-lockfile
      - name: Generate Riverpod and mocks
        run: dart run build_runner build
      - name: Verify goldens
        run: flutter test --fail-fast --tags gold --run-skipped
      - name: Upload golden mismatch images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-mismatches
          path: test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7
  test:
    if: contains(github.event.pull_request.labels.*.name, 'auto-test')
    runs-on: ubuntu-latest
    needs: check-goldens
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            pubspec.yaml
            pubspec.lock
            analysis_options.yaml
            dart_test.yaml
            lib
            test
            android
            ios
            assets
            integration_test
      - name: Extract Flutter version
        id: get_version
        run: |
          VERSION=$(sed -n -E "s/^[[:space:]]*flutter:[[:space:]]*([0-9]+\.[0-9.]+).*/\1/p" pubspec.yaml)
          if [ -z "$VERSION" ]; then
            echo "Error: Could not find a Flutter version specified in pubspec.yaml."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.get_version.outputs.version }}
          cache: true
      - name: Disable analytics
        run: flutter config --no-analytics --suppress-analytics
      - run: flutter pub get --enforce-lockfile
      - name: Generate Riverpod and mocks
        run: dart run build_runner build
      - name: Run tests
        run: flutter test --coverage
  build:
    if: contains(github.event.pull_request.labels.*.name, 'auto-build')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            pubspec.yaml
            pubspec.lock
            analysis_options.yaml
            dart_test.yaml
            lib
            test
            android
            ios
            assets
            integration_test
      - name: Extract Flutter version
        id: get_version
        run: |
          VERSION=$(sed -n -E "s/^[[:space:]]*flutter:[[:space:]]*([0-9]+\.[0-9.]+).*/\1/p" pubspec.yaml)
          if [ -z "$VERSION" ]; then
            echo "Error: Could not find a Flutter version specified in pubspec.yaml."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.get_version.outputs.version }}
          cache: true
      - name: Disable analytics
        run: flutter config --no-analytics --suppress-analytics
      - run: flutter pub get --enforce-lockfile
      - name: Generate Riverpod and mocks
        run: dart run build_runner build
      - name: Set Up Java
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'oracle'
          java-version: '17'
        # no efficient caching possible
      - name: Build
        run: flutter build apk --debug
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-results
          path: build/app/outputs/flutter-apk
