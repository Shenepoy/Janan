name: flutter_settings_framework
description: Declarative Flutter settings with bilingual search, a Riverpod adapter, and ready-made settings UI.
version: 0.11.0
homepage: https://github.com/Zyzto/edadat
repository: https://github.com/Zyzto/edadat
issue_tracker: https://github.com/Zyzto/edadat/issues
license: MPL-2.0
environment:
  sdk: ^3.11.0
  flutter: ">=3.11.0"

dependencies:
  material_ui: ^1.11.0
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  flutter_riverpod: ^3.4.2
  easy_localization: ^3.0.8
  safaeh:
    path: ../safaeh

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

publish_to: none
