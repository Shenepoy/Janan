name: safaeh
description: Adaptive sheets, dialogs, camera/QR chrome, page index, and sidenav for Flutter.
version: 0.12.0
homepage: https://github.com/Zyzto/Safaeh
repository: https://github.com/Zyzto/Safaeh
issue_tracker: https://github.com/Zyzto/Safaeh/issues
license: MPL-2.0
environment:
  sdk: ^3.11.0
  flutter: ">=3.11.0"

dependencies:
  material_ui: ^1.11.0
  camera_cutout: ^0.1.0
  flutter:
    sdk: flutter
  toastification: ^3.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  shaders:
    - shaders/safaeh_genie.frag

publish_to: none
